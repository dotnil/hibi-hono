name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Install dependencies
        run: nix develop --command npm ci

      - name: Check formatting
        run: nix develop --command npm run format:check

      - name: Run lint
        run: nix develop --command npm run lint

      - name: Check types
        run: nix develop --command npm run check

      - name: Run tests
        env:
          TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: nix develop --command env TEST_ADMIN_DATABASE_URL="$TEST_ADMIN_DATABASE_URL" npm test
